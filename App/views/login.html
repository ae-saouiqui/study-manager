<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Public/static/Css/bootstrap.min.css">
    <script src="../../Public/static/Js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../Public/static/Css/login.css">
    <title>E-SERVICES</title>
    <link rel="icon" href="../../Public/static/Images/ensahb.png">
</head>

<body>
    <section class="login-section">
        <div class="login-form">
            <form action="" method="post">
                <label for="email" class="d-block login-label">Email</label>
                <input type="email" required name="email" id="email" class="login-input"
                    placeholder="Veuillez saisir votre email">
                <label for="password" class="d-block login-label">Mot de Passe</label>
                <input type="password" id="password" required name="password" class="login-input"
                    placeholder="Veuillez saisir votre mot de passe">
                <input type="submit" value="Login" class="login-btn">
            </form>
        </div>
        <div class="login-img">
            <a href="https://ensah.ma">
                <img src="../../Public/static/Images/ensah.png" alt="">
            </a>
        </div>
    </section>
    <span class="bubble-1"></span>
    <span class="bubble-2"></span>
    <div class="modal login-error fade" id="error" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                    <div class="modal-header d-flex justify-content-between">
                        <h5 class="modal-title">ERREUR</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                <div class="modal-body">
                   <p>Mot de passe ou Email incorrecte</p>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="../../Public/static/Js/login.js"></script>

</html>
