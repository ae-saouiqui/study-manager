services:

  web:
    build: .
    container_name: study-manager-web
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  websocket:
    build: .
    container_name: study-manager-websocket
    command: php server.php
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    container_name: study-manager-db
    environment:
      MYSQL_DATABASE: ESERVICE
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./eservice.sql:/docker-entrypoint-initdb.d/eservice.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 5s
      retries: 20

volumes:
  mysql_data: